name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Run repository gate
        shell: powershell
        run: powershell -File scripts/run_full_tests_windows.ps1
