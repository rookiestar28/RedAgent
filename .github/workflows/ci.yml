name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosted-windows-qualification:
    name: Hosted Windows qualification (non-authoritative)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Run hosted Windows qualification
        shell: powershell
        run: powershell -File scripts/run_hosted_windows_qualification.ps1
