id: redagent-r105-missing-header

info:
  name: R105 Missing Security Header
  author: redagent
  severity: low
  tags: redagent,synthetic

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuclei/missing-header"
    redirects: false
    max-redirects: 0
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        name: missing-security-header
        part: header
        negative: true
        words:
          - X-Content-Type-Options
