minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Sigstore bundles are generated byte-addressed evidence; formatting
        # them would invalidate recorded bundle hashes.
        exclude: '^(?:\.local/validation|runtime-assets/attestations)/.*\.sigstore\.json$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--exclude-files"
          - "package-lock.json"
          # Sigstore bundles are public signature/transparency evidence and
          # intentionally contain high-entropy signatures and certificates.
          - "--exclude-files"
          - '^(?:\.local[\\/]validation|runtime-assets[\\/]attestations)[\\/].*\.sigstore\.json$'
          # This exact report contains only public evidence hashes and a Git revision;
          # its detached signature is verified separately and no credential value exists.
          - "--exclude-files"
          - '^\.local/validation[\\/]260712-R117_SIGNED_NO_GO_REPORT\.json$'
          # Named public Git object IDs are immutable provenance, not credentials.
          - "--exclude-lines"
          - '^\s*"source_(?:revision|base)":\s*"[0-9a-f]{40}",?\s*$'
          # Public deterministic issue fingerprints are test oracles, not credentials.
          - "--exclude-lines"
          - '^\s*"expected_fingerprint":\s*"[0-9a-f]{64}",?\s*$'
          # Named immutable SHA-256/digest fields are public integrity values,
          # including JSON locks and Python test fixtures.
          - "--exclude-lines"
          - '(?i)(?:sha256|digest)[^\n:=]*[:=][^0-9a-f]*(?:sha256:)?[0-9a-f]{64}'
          # ECDSA promotion signatures are public verification evidence, not signing keys.
          - "--exclude-lines"
          - '^\s*"signature_base64":\s*"[A-Za-z0-9+/=]+",?\s*$'
          # compat_118 fixed vectors contain only a public DER SPKI and public P1363 signature.
          - "--exclude-lines"
          - '^\s*"(?:public_key_spki_der_b64|signature_p1363_b64)":\s*"[A-Za-z0-9+/=]+",?\s*$'
          # Kubernetes volume source key; the line contains no secret material.
          - "--exclude-lines"
          - '^\s*"secret":\s*\{\s*$'
          # Kubernetes secretName is a metadata reference, never the referenced value.
          - "--exclude-lines"
          - '(?i)secretName'
