minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Sigstore bundles are generated byte-addressed evidence; formatting
        # them would invalidate recorded bundle hashes.
        exclude: '^(?:\.local/validation|runtime-assets/attestations)/.*\.sigstore\.json$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--exclude-files"
          - "package-lock.json"
          # Sigstore bundles are public signature/transparency evidence and
          # intentionally contain high-entropy signatures and certificates.
          - "--exclude-files"
          - '^(?:\.local[\\/]validation|runtime-assets[\\/]attestations)[\\/].*\.sigstore\.json$'
          # This exact report contains only public evidence hashes and a Git revision;
          # its detached signature is verified separately and no credential value exists.
          - "--exclude-files"
          - '^\.local/validation[\\/]260712-R117_SIGNED_NO_GO_REPORT\.json$'
          # Named public Git object IDs are immutable provenance, not credentials.
          - "--exclude-lines"
          - '^\s*"source_(?:revision|base)":\s*"[0-9a-f]{40}",?\s*$'
          # Public deterministic issue fingerprints are test oracles, not credentials.
          - "--exclude-lines"
          - '^\s*"expected_fingerprint":\s*"[0-9a-f]{64}",?\s*$'
          # Named immutable SHA-256/digest fields are public integrity values,
          # including JSON locks and Python test fixtures.
          - "--exclude-lines"
          - '(?i)(?:sha256|digest)[^\n:=]*[:=][^0-9a-f]*(?:sha256:)?[0-9a-f]{64}'
          # SPDX/Trivy identifiers and checksums are public package integrity metadata.
          - "--exclude-lines"
          - '^\s*"(?:checksumValue|packageVerificationCodeValue)":\s*"[0-9a-f]{40}(?:[0-9a-f]{24})?",?\s*$'
          - "--exclude-lines"
          - '^\s*"UID":\s*"[0-9a-f]{1,16}",?\s*$'
          - "--exclude-lines"
          - '^\s*"(?:SPDXID|relatedSpdxElement|spdxElementId)":\s*"SPDXRef-(?:OperatingSystem|ContainerImage)-[0-9a-f]{16}",?\s*$'
          # Closed source-file hash maps retain their exact public path and SHA-256 value.
          - "--exclude-lines"
          - '^\s*"(?:containers/[^"\\]+|config/(?:owned-helper-dependencies-v3|r10[45]-[a-z]+-runtime(?:-v2)?)\.json|bundles/r105-nuclei/bundle-manifest(?:-v2)?\.json|runtime-assets/attestations/[^"\\]+|\.tmp/runtime-requalification-v3/packages/lib(?:crypto3|ssl3)-3\.5\.9-r0\.apk)":\s*"[0-9a-f]{64}",?\s*$'
          - "--exclude-lines"
          - '^\s*"(?:run\.crashoverride\.commit-id|org\.opencontainers\.image\.revision)":\s*"[0-9a-f]{40}",?\s*$'
          # Exact public upstream JRE archive checksum in frozen image build history.
          - "--exclude-lines"
          - "ESUM='22d4d5579902d134dede626d0fdfb95891abc7578e13dea9cb23775498c4cf51'"
          # Fixed upstream locale paths are package inventory, not Microsoft credentials.
          - "--exclude-lines"
          - '^\s*"usr/share/X11/locale/microsoft-cp(?:1251|1255|1256)/(?:XI18N_OBJS|XLC_LOCALE)",?\s*$'
          # ECDSA promotion signatures are public verification evidence, not signing keys.
          - "--exclude-lines"
          - '^\s*"signature_base64":\s*"[A-Za-z0-9+/=]+",?\s*$'
          # compat_118 fixed vectors contain only a public DER SPKI and public P1363 signature.
          - "--exclude-lines"
          - '^\s*"(?:public_key_spki_der_b64|signature_p1363_b64)":\s*"[A-Za-z0-9+/=]+",?\s*$'
          # Kubernetes volume source key; the line contains no secret material.
          - "--exclude-lines"
          - '^\s*"secret":\s*\{\s*$'
          # Kubernetes secretName is a metadata reference, never the referenced value.
          - "--exclude-lines"
          - '(?i)secretName'
  - repo: local
    hooks:
      - id: item-code-module-names
        name: reject item-coded product module filenames
        entry: python scripts/item_code_identifiers.py
        language: system
        pass_filenames: false
      - id: item-code-python-definitions
        name: reject item-coded product class and function definitions
        entry: ast-grep scan --config sgconfig.yml redagent_platform
        language: node
        additional_dependencies:
          - "@ast-grep/cli@0.45.0"
        pass_filenames: false
